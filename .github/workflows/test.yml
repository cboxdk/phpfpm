name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  # Pinned to the patch, not the minor. `1.26.x` can resolve to a toolchain
  # that still ships standard-library advisories -- go1.26.6 fixes four that
  # govulncheck reports against 1.26.5. Bump this when the scan fails on the
  # standard library: that is the gate working.
  GO_VERSION: '1.26.6'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Verify gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      # Diff the whole tree rather than naming go.sum: a module with no
      # dependencies yet has no go.sum, and naming a path git does not know
      # fails with exit 128 instead of reporting "tidy".
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -cover ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  vulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  sbom:
    name: SBOM is current
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The committed sbom.json must match what go.mod produces, so a
      # dependency added without regenerating it fails here rather than shipping
      # a bill of materials that lies about what is inside.
      - name: Check the SBOM is not stale
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
          make sbom-check

  # The control and validation tests stand php-fpm in with shell stubs, or skip
  # entirely without a binary. That covers the logic and nothing about what
  # php-fpm actually does — which is the whole subject of this library. This job
  # installs one so those tests run for real.
  integration:
    name: Against a real PHP-FPM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install PHP-FPM
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends php-fpm
          sudo systemctl stop php*-fpm || true

      - name: Run tests with php-fpm available
        run: go test -race ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # This library reaches for /proc, process listings and signals, so the
      # platform split is real: compiling only on the test runner would let a
      # Linux-only path break the darwin build unnoticed. No binary is produced
      # -- there is no main package here.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build ./...
